# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# Window rules for Switcheroo (io.gitlab.adhami3310.Converter)
windowrule = match:class ^(io\.gitlab\.adhami3310\.Converter)$, float on
windowrule = match:class ^(io\.gitlab\.adhami3310\.Converter)$, center on
windowrule = match:class ^(io\.gitlab\.adhami3310\.Converter)$, size 800 650

# Window rules for HandBrake (ghb or fr.handbrake.ghb)
windowrule = match:class ^(fr\.handbrake\.ghb)$, float on
windowrule = match:class ^(fr\.handbrake\.ghb)$, center on
windowrule = match:class ^(fr\.handbrake\.ghb)$, size 1050 720

windowrule = match:class ^(ghb)$, float on
windowrule = match:class ^(ghb)$, center on
windowrule = match:class ^(ghb)$, size 1050 720

# AppImageLauncher configuration for seamless automated integration
[AppImageLauncher]
# Disable the interactive "Integrate and run" prompt dialog
ask_to_move = false

# Directory where integrated AppImages reside
destination = ~/Applications

# Enable daemon background integration
enable_daemon = true

[appimagelauncherd]
# Directories to automatically watch and integrate
additional_directories_to_watch = ~/Applications:~/Downloads

# Monitor mounted external media if desired
monitor_mounted_filesystems = false
